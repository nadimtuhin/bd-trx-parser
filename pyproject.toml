[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bd-trx-parser"
version = "0.1.0"
description = "Parse transaction and balance SMS from Bangladeshi banks and mobile wallets (EBL, DBBL, City, AMEX, AIBL, bKash, Nagad, Midland, PathaoPay)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nadim Tuhin" }]
keywords = ["bangladesh", "sms", "bank", "bkash", "nagad", "transaction", "parser", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
bd-trx-parser = "bd_trx_parser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bd_trx_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
